<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaPay Balance · MetCart</title><style>body{font:16px/1.5 system-ui;background:#f4f7fb;color:#172334;margin:0}header,main{max-width:850px;margin:auto;padding:20px}header{background:white;max-width:none}section{background:white;padding:22px;border:1px solid #dfe7f0;border-radius:15px;margin-top:20px}a{color:#24548d;font-weight:700;text-decoration:none}li{padding:8px;border-bottom:1px solid #e5ebf2}</style></head><body><header><a href="settings.html">← Settings</a></header><main><h1>InstaPay balance</h1><section id="content">Loading your wallet…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const url='https://brahcvovidgjjzpkxsms.supabase.co',key='sb_publishable_FFhWnTcsx3JflSHkIDaSaQ_Mwhh83up',sb=window.supabase.createClient(url,key);const money=n=>'π'+(Number(n||0)/100).toLocaleString('en-IN',{maximumFractionDigits:2});async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('content').innerHTML='<p>Sign in through MetCart first, then return here.</p><a href="index.html">Open MetCart sign in →</a>';return}const {data:p,error}=await sb.from('profiles').select('id,username,display_name,jp_balance,role,subscription_tier').eq('id',session.user.id).single();if(error){document.getElementById('content').textContent='Could not load your account. Return to MetCart and sign in again.';return}window.metProfile=p;document.getElementById('content').innerHTML=`<h2>${money(p.jp_balance)} JP (π)</h2><p>Balance is read from your Metxon wallet. MetCart payments use this balance.</p><p><a href='elite.html'>Buy Elite membership →</a></p><h3>Recent wallet transactions</h3><div id='tx'>Loading transactions…</div>;if(window.afterLoad)window.afterLoad(p);const t=await sb.from('transactions').select('type,amount,note,created_at').eq('user_id',p.id).order('created_at',{ascending:false}).limit(20);document.getElementById('tx').innerHTML=t.error?'Transactions are temporarily unavailable.':(t.data||[]).map(x=>'<li>'+x.type+' · '+money(x.amount)+' · '+(x.note||'')+'</li>').join('')||'<p>No transactions yet.</p>'}load();</script></body></html>
