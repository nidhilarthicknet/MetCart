name: Deploy MetCart to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.html || {
            echo "ERROR: index.html is missing from the repository root."
            exit 1
          }
          echo "MetCart index.html found."

      - name: Verify Pages setup token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::Missing repository Actions secret PAGES_TOKEN. Add a fine-grained token restricted to this repository with Pages read/write permission, then rerun this workflow."
            exit 1
          fi

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
